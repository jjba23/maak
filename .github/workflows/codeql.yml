# CodeQL in an advanced setup, so that the languages and the build mode are the
# ones written here rather than the ones an autodetection pass guesses at from
# the tree.  Default setup re-detects languages on its own, which is how the
# `Analyze (java-kotlin)` job came to fail on every push: it found
# `contrib/intellij/build.gradle.kts` and the checkout has no build it can run.
#
# Java and Kotlin are not in the matrix, and that is a limit of the plugin's
# build rather than a choice about coverage.  `build-mode: none` is meant for
# exactly this case, but the Java extractor still resolves the project's
# dependencies, so it runs Gradle over `contrib/intellij`, which fails at
# `settings.gradle.kts:5: Unresolved reference 'intellijPlatform'` -- the
# IntelliJ platform DSL there is one that only a project script has.  When that
# script builds again, `java-kotlin` can come back with `build-mode: none`.
#
# Every language here is build-free, so no job has a build step.  `contrib/vscode'
# is the JavaScript and TypeScript, `contrib/sublime/maak.py' the Python, the
# packaging recipes the Ruby, and this directory the GitHub Actions.

name: CodeQL

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  schedule:
    # Weekly, at a time nobody is releasing.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: 🔎 ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, ruby]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
