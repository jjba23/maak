# CodeQL in an advanced setup, so that the languages are the ones written here
# rather than the ones an autodetection pass guesses at from the tree.
#
# The guess is what broke: default setup found `contrib/intellij/build.gradle.kts'
# and ran the Java/Kotlin autobuilder, which looks for a build it can run at the
# top of a checkout and found none -- the plugin has no wrapper and its build
# downloads the IntelliJ platform -- so the language failed with a configuration
# error on every push that touched Kotlin files.  `build-mode: none' is the fix
# the error asked for: the sources are analysed without a build, which is what a
# code scan of two Kotlin files needs and what a hosted runner can do.
#
# Every language here is build-free, so no job has a build step.  `contrib/vscode'
# is the JavaScript and TypeScript, `contrib/sublime/maak.py' the Python, the
# packaging recipes the Ruby, and this directory the GitHub Actions.

name: CodeQL

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  schedule:
    # Weekly, at a time nobody is releasing.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: 🔎 ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, java-kotlin, javascript-typescript, python, ruby]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
