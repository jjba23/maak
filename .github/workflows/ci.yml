name: CI

on:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  byggsteg:
    name: 🧱 Byggsteg
    # The released bridge rather than its trunk: what maak runs is a version
    # somebody chose, not whatever that repository's main branch says today.
    uses: jjba23/byggsteg-github/.github/workflows/byggsteg.yml@v0.1.1
    with:
      tasks: maak-test maak-deploy
      timeout-minutes: 60
    secrets: inherit
